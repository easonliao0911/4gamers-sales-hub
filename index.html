<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>業務訓練工具</title>
    <meta property="og:title" content="業務訓練工具">
    <meta property="og:description" content="業務話術訓練平台，依產業與銷售階段快速查詢對話策略。">
    <meta name="description" content="業務話術訓練平台，依產業與銷售階段快速查詢對話策略。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* ===================================================
           CSS 變數 — 色彩系統（依照需求文件第四章）
           =================================================== */
        :root {
            --primary:      #0D2137;  /* 深藍：頁頭、主強調色 */
            --navy:         #1A3A5C;  /* 海軍藍：Tab 選中、開場白卡片 */
            --sales-bg:     #EBF3FB;  /* 淺藍：業務接球話術背景 */
            --client-bg:    #FDF6EE;  /* 淺橘：客戶說的話背景 */
            --memo-bg:      #F5F5F5;  /* 淺灰：業務備忘背景 */
            --confirm:      #0F6E56;  /* 深綠：接球關鍵標籤文字 */
            --border:       #CCCCCC;  /* 所有卡片邊框 */
            --page-bg:      #F9FAFB;  /* 頁面背景 */
            --white:        #FFFFFF;
            --text-blue:    #0C447C;  /* 業務開場白、接球話術文字色 */
            --text-dark:    #222222;  /* 異議按鈕文字 */
            --text-memo:    #5F5E5A;  /* 備忘文字（深灰） */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Noto Sans TC', Arial, sans-serif;
            background: var(--page-bg);
            color: var(--text-dark);
            min-height: 100vh;
        }

        /* ===================================================
           頂部導覽列
           =================================================== */
        .navbar {
            background: var(--primary);
            color: white;
            padding: 0 24px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
            gap: 16px;
        }

        .navbar-brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

        .navbar-logo {
            font-size: 18px;
            font-weight: 700;
            color: white;
            letter-spacing: 0.3px;
        }

        .navbar-subtitle {
            font-size: 11px;
            color: rgba(255,255,255,0.55);
            margin-top: 2px;
        }

        /* 產業切換下拉選單 */
        .industry-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .industry-selector label {
            color: rgba(255,255,255,0.75);
            font-size: 13px;
            white-space: nowrap;
        }

        .industry-select {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 7px 14px 7px 10px;
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            outline: none;
            transition: background 0.2s;
            min-width: 180px;
        }

        .industry-select:hover { background: rgba(255,255,255,0.22); }
        .industry-select option { background: var(--primary); color: white; }

        /* 搜尋欄：Phase 2 預留位置 */
        .search-placeholder { display: flex; align-items: center; gap: 6px; }

        .search-input {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.18);
            color: rgba(255,255,255,0.35);
            padding: 7px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
            width: 190px;
            cursor: not-allowed;
        }

        .search-badge {
            background: rgba(255,180,0,0.25);
            color: rgba(255,210,100,0.9);
            font-size: 10px;
            padding: 2px 7px;
            border-radius: 10px;
            white-space: nowrap;
            border: 1px solid rgba(255,180,0,0.3);
        }

        /* ===================================================
           主要內容容器
           =================================================== */
        .main-container {
            max-width: 960px;
            margin: 0 auto;
            padding: 28px 20px 48px;
        }

        /* ===================================================
           載入動畫
           =================================================== */
        .loading-overlay {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 100px 20px;
            gap: 18px;
        }

        .spinner {
            width: 38px;
            height: 38px;
            border: 3px solid var(--border);
            border-top-color: var(--navy);
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text { color: var(--text-memo); font-size: 14px; }

        /* ===================================================
           錯誤提示
           =================================================== */
        .error-box {
            background: #FFF5F5;
            border: 1.5px solid #FFCCCC;
            border-radius: 10px;
            padding: 28px 24px;
            text-align: center;
            margin-top: 40px;
        }

        .error-box h3 { color: #C00; margin-bottom: 10px; font-size: 16px; }
        .error-box p { color: #555; font-size: 13px; line-height: 1.6; }

        .error-box button {
            margin-top: 16px;
            background: var(--primary);
            color: white;
            border: none;
            padding: 9px 22px;
            border-radius: 7px;
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.15s;
        }

        .error-box button:hover { background: var(--navy); }

        /* 未設定 Google Sheets 提示 */
        .config-notice {
            background: #FFFBEA;
            border: 1.5px solid #FFE082;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 12px;
            color: #7A6000;
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .config-notice-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }

        /* ===================================================
           業務開場白卡片
           =================================================== */
        .opener-card {
            background: var(--navy);
            border-radius: 12px;
            padding: 22px 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px rgba(13,33,55,0.15);
        }

        .opener-card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .stage-badge {
            background: rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.85);
            font-size: 11px;
            padding: 3px 11px;
            border-radius: 20px;
            font-weight: 500;
            white-space: nowrap;
        }

        .opener-title {
            font-size: 16px;
            font-weight: 700;
            color: white;
        }

        .opener-label {
            font-size: 10px;
            color: rgba(255,255,255,0.5);
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .opener-text {
            font-size: 15px;
            line-height: 1.75;
            color: rgba(255,255,255,0.92);
        }

        /* ===================================================
           對話階段 Tab 列
           =================================================== */
        .stage-tabs-wrapper { margin-bottom: 20px; }

        .stage-tabs-label {
            font-size: 11px;
            color: var(--text-memo);
            margin-bottom: 8px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stage-tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .stage-tab {
            padding: 8px 16px;
            border-radius: 7px;
            border: 1.5px solid var(--border);
            background: var(--white);
            color: var(--text-memo);
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
            line-height: 1;
        }

        .stage-tab:hover { border-color: var(--navy); color: var(--navy); }

        .stage-tab.active {
            background: var(--navy);
            color: white;
            border-color: var(--navy);
            font-weight: 500;
        }

        /* ===================================================
           客戶異議按鈕區
           =================================================== */
        .objection-section {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px 20px 20px;
            margin-bottom: 20px;
        }

        .objection-section-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 3px;
        }

        .objection-section-subtitle {
            font-size: 12px;
            color: var(--text-memo);
            margin-bottom: 16px;
        }

        .objection-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .objection-btn {
            background: var(--white);
            border: 1.5px solid var(--border);
            border-radius: 8px;
            padding: 13px 14px;
            text-align: left;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.15s;
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-height: 72px;
        }

        .objection-btn:hover {
            border-color: var(--navy);
            background: #F5F8FF;
        }

        .objection-btn.selected {
            border-color: var(--navy);
            border-width: 2px;
            background: var(--sales-bg);
        }

        .objection-tag {
            font-size: 10px;
            font-weight: 700;
            color: var(--confirm);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .objection-preview {
            font-size: 13px;
            color: var(--text-dark);
            line-height: 1.45;
        }

        /* ===================================================
           話術展示區（點擊異議後顯示）
           =================================================== */
        .response-area {
            display: none;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
            animation: fadeIn 0.2s ease;
        }

        .response-area.visible { display: flex; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        /* 對話泡泡共用 */
        .dialogue-bubble {
            border-radius: 12px;
            padding: 16px 18px;
        }

        .bubble-header {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 10px;
        }

        .bubble-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .bubble-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .bubble-content { font-size: 14px; line-height: 1.75; }

        /* 客戶說的話（橘色） */
        .client-bubble {
            background: var(--client-bg);
            border: 1px solid #F0D8BE;
        }

        .client-bubble .bubble-icon { background: #F5C8A0; color: #7A4A1A; }
        .client-bubble .bubble-label { color: #8B4A1A; }
        .client-bubble .bubble-content { color: #5C3A1A; }

        /* 業務接球話術（藍色） */
        .sales-bubble {
            background: var(--sales-bg);
            border: 1px solid #B8D4EE;
        }

        .sales-bubble .bubble-icon { background: #A8C8F0; color: var(--text-blue); }
        .sales-bubble .bubble-label { color: var(--text-blue); }
        .sales-bubble .bubble-content { color: var(--text-blue); }

        /* 業務備忘（灰色） */
        .memo-block {
            background: var(--memo-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px 16px;
        }

        .memo-header {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 8px;
        }

        .memo-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--confirm);
            flex-shrink: 0;
        }

        .memo-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--confirm);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .memo-content {
            font-size: 12px;
            color: var(--text-memo);
            line-height: 1.65;
        }

        .source-tag {
            font-size: 10px;
            color: #AAA;
            margin-top: 8px;
            font-style: italic;
            display: none;
        }

        /* ===================================================
           底部導航列
           =================================================== */
        .nav-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 4px;
            gap: 12px;
        }

        .nav-btn {
            background: var(--white);
            border: 1.5px solid var(--border);
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 13px;
            font-family: inherit;
            color: var(--text-dark);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s;
            white-space: nowrap;
        }

        .nav-btn:hover:not(:disabled) { border-color: var(--navy); color: var(--navy); }

        .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }

        .nav-btn.primary {
            background: var(--navy);
            color: white;
            border-color: var(--navy);
        }

        .nav-btn.primary:hover:not(:disabled) { background: var(--primary); border-color: var(--primary); }

        .progress-indicator { font-size: 13px; color: var(--text-memo); text-align: center; flex: 1; }

        /* ===================================================
           RWD：平板（768px）與手機（480px）
           =================================================== */
        @media (max-width: 768px) {
            .navbar {
                flex-wrap: wrap;
                height: auto;
                padding: 12px 16px;
                gap: 10px;
            }

            .search-placeholder { display: none; }

            .objection-grid { grid-template-columns: 1fr; }

            .stage-tabs {
                overflow-x: auto;
                flex-wrap: nowrap;
                padding-bottom: 4px;
                -webkit-overflow-scrolling: touch;
            }

            .main-container { padding: 16px 14px 40px; }
        }

        @media (max-width: 480px) {
            .navbar-subtitle { display: none; }

            .nav-footer {
                flex-direction: column;
                align-items: stretch;
            }

            .nav-btn { justify-content: center; }

            .progress-indicator { order: -1; }
        }
    </style>
</head>
<body>

<!-- ===================================================
     頂部導覽列
     =================================================== -->
<nav class="navbar">
    <div class="navbar-brand">
        <div>
            <div class="navbar-logo">業務訓練工具</div>
            <div class="navbar-subtitle">業務開發百科全書 · Sales Training Hub</div>
        </div>
    </div>

    <!-- 產業切換下拉選單（功能 B） -->
    <div class="industry-selector">
        <label for="industrySelect">產業類型：</label>
        <select id="industrySelect" class="industry-select" onchange="onIndustryChange(this.value)">
            <option value="">載入中...</option>
        </select>
    </div>

    <!-- 搜尋欄：Phase 2 預留位置（功能 D） -->
    <div class="search-placeholder">
        <input type="text" class="search-input" placeholder="搜尋話術關鍵字…" disabled
               title="搜尋功能將於 Phase 2 開放">
        <span class="search-badge">Phase 2</span>
    </div>
</nav>

<!-- ===================================================
     主要內容區
     =================================================== -->
<div class="main-container">
    <div id="appContent">
        <!-- 啟動時先顯示載入動畫，JS 初始化後替換 -->
        <div class="loading-overlay">
            <div class="spinner"></div>
            <div class="loading-text">正在載入話術內容...</div>
        </div>
    </div>
</div>


<script>
/* ============================================================
   CONFIG 區塊
   業務主管：請在這裡填入您的 Google Sheets 設定
   ============================================================ */
const CONFIG = {

     * 步驟 1：將下方字串替換成您的 Google Sheets ID

    /* Sheet 頁籤名稱（與 Google Sheets 的 Sheet 名稱對應，通常不需要修改） */

        industries: 'industries',
        stages:     'stages',
        dialogues:  'dialogues',

/* ============================================================

        {
            stage_id:    '2',

/* ============================================================
   全域應用程式狀態
   ============================================================ */
const state = {
    industries:        [],   /* 所有產業資料 */
    stages:            [],   /* 所有階段資料 */
    dialogues:         [],   /* 所有話術資料 */
    currentIndustryId: null, /* 目前選中的產業 ID */
    currentStageId:    null, /* 目前選中的階段 ID */
};


/* ============================================================
   快取工具：用 localStorage 儲存 API 結果，避免頻繁呼叫
   ============================================================ */
function getCachedSheet(sheetName) {
    try {
        const raw = localStorage.getItem(`4g_cache_${sheetName}`);
        if (!raw) return null;
        const { timestamp, data } = JSON.parse(raw);
        const ageMin = (Date.now() - timestamp) / 60000;
        if (ageMin > CONFIG.CACHE_MINUTES) return null; /* 快取過期 */
        return data;
    } catch { return null; }
}

function setCachedSheet(sheetName, data) {
    try {
        localStorage.setItem(`4g_cache_${sheetName}`, JSON.stringify({
            timestamp: Date.now(),
            data,
        }));
    } catch { /* 快取失敗不影響功能 */ }
}

/* 判斷使用者是否已在 CONFIG 填入真實的 Google Sheets 設定 */
function isSheetsConfigured() {
    return CONFIG.SHEET_ID !== 'YOUR_GOOGLE_SHEET_ID_HERE'
        && CONFIG.API_KEY !== 'YOUR_GOOGLE_API_KEY_HERE'
        && CONFIG.SHEET_ID.trim().length > 10;
}


/* ============================================================
   Google Sheets API 讀取
   將 Sheets 的二維陣列（第一列為 header）轉換成物件陣列
   ============================================================ */
async function fetchSheetData(sheetName) {
    /* 先查快取 */
    const cached = getCachedSheet(sheetName);
    if (cached) return cached;

    const url = `https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.SHEET_ID}/values/${encodeURIComponent(sheetName)}?key=${CONFIG.API_KEY}`;
    const res  = await fetch(url);

    if (!res.ok) {
        const errBody = await res.text().catch(() => '');
        throw new Error(`讀取 ${sheetName} 失敗（HTTP ${res.status}）：${errBody.slice(0, 200)}`);
    }

    const json = await res.json();
    if (!json.values || json.values.length < 2) return [];

    /* 第一列是欄位名稱，其他列轉成物件 */
    const [headers, ...rows] = json.values;
    const data = rows.map(row => {
        const obj = {};
        headers.forEach((h, i) => { obj[h] = row[i] ?? ''; });
        return obj;
    });

    setCachedSheet(sheetName, data);
    return data;
}


/* ============================================================
   啟動：載入所有資料，決定使用 Google Sheets 或預設資料
   ============================================================ */
async function boot() {
    showLoadingState();

    try {
        if (isSheetsConfigured()) {
            /* 三個 Sheet 同時呼叫，節省等待時間 */
            const [industries, stages, dialogues] = await Promise.all([
                fetchSheetData(CONFIG.SHEETS.industries),
                fetchSheetData(CONFIG.SHEETS.stages),
                fetchSheetData(CONFIG.SHEETS.dialogues),
            ]);
            state.industries = industries;
            state.stages     = stages;
            state.dialogues  = dialogues;
        } else {
            /* 使用內建預設資料 */
            state.industries = FALLBACK_DATA.industries;
            state.stages     = FALLBACK_DATA.stages;
            state.dialogues  = FALLBACK_DATA.dialogues;
        }

        renderApp();

    } catch (err) {
        showErrorState(`內容載入失敗，請重新整理頁面。\n\n錯誤詳情：${err.message}`);
    }
}


/* ============================================================
   渲染整個 App 框架（首次載入或切換產業時呼叫）
   ============================================================ */
function renderApp() {
    /* 篩選啟用中的產業並排序 */
    const activeIndustries = state.industries
        .filter(i => isActive(i.is_active))
        .sort((a, b) => +a.sort_order - +b.sort_order);

    if (activeIndustries.length === 0) {
        showErrorState('目前沒有可用的產業內容，請在 Google Sheets 的 industries Sheet 中確認 is_active 欄位設為 TRUE。');
        return;
    }

    /* 填充產業下拉選單 */
    const sel = document.getElementById('industrySelect');
    sel.innerHTML = '';
    activeIndustries.forEach(ind => {
        const opt = new Option(ind.industry_name_zh, ind.industry_id);
        sel.appendChild(opt);
    });

    /* 渲染主介面結構 */
    renderMainLayout();

    /* 預設選擇第一個產業 */
    selectIndustry(activeIndustries[0].industry_id);
}

/* ============================================================
   切換產業（下拉選單 onchange 觸發）
   ============================================================ */
function onIndustryChange(industryId) {
    selectIndustry(industryId);
}

function selectIndustry(industryId) {
    state.currentIndustryId = industryId;
    state.currentStageId    = null;

    /* 若 DOM 結構被上一次錯誤狀態破壞，先重建 */
    if (!document.getElementById('stageTabs')) {
        renderMainLayout();
    }

    /* 取得此產業的啟用階段，依 sort_order 排序 */
    const stages = getActiveStages(industryId);

    if (stages.length === 0) {
        document.getElementById('stageTabs').innerHTML = '';
        document.getElementById('objectionGrid').innerHTML = `
            <div class="error-box" style="grid-column:1/-1">
                <h3>此產業尚無對話階段</h3>
                <p>請在 Google Sheets 的 stages Sheet 中為「${industryId}」新增對話階段。</p>
            </div>`;
        document.getElementById('responseArea').style.display  = 'none';
        document.getElementById('openerText').textContent      = '';
        document.getElementById('openerTitle').textContent     = '';
        document.getElementById('stageBadge').textContent      = '';
        document.getElementById('progressText').textContent    = '';
        document.getElementById('prevBtn').disabled            = true;
        document.getElementById('nextBtn').disabled            = true;
        return;
    }

    /* 恢復話術展示區（若之前被隱藏） */
    document.getElementById('responseArea').style.display = '';

    /* 渲染 Stage Tab 列 */
    renderStageTabs(stages);

    /* 預設進入第一個階段 */
    selectStage(stages[0].stage_id);
}


/* ============================================================
   渲染 Stage Tab 按鈕列
   ============================================================ */
function renderStageTabs(stages) {
    const container = document.getElementById('stageTabs');
    if (!container) return;
    container.innerHTML = '';
    stages.forEach(s => {
        const btn = document.createElement('button');
        btn.className = 'stage-tab';
        btn.id        = `tab_${s.stage_id}`;
        btn.textContent = s.stage_label;
        btn.onclick   = () => selectStage(s.stage_id);
        container.appendChild(btn);
    });
}


/* ============================================================
   切換對話階段
   ============================================================ */
function selectStage(stageId) {
    state.currentStageId = stageId;

    const stages      = getActiveStages(state.currentIndustryId);
    const stage       = stages.find(s => s.stage_id === stageId);
    const stageIndex  = stages.indexOf(stage);

    if (!stage) return;

    /* 更新 Tab 樣式 */
    stages.forEach(s => {
        const el = document.getElementById(`tab_${s.stage_id}`);
        if (el) el.className = s.stage_id === stageId ? 'stage-tab active' : 'stage-tab';
    });

    /* 更新開場白卡片 */
    document.getElementById('stageBadge').textContent  = `階段 ${stageIndex + 1}`;
    document.getElementById('openerTitle').textContent = stage.stage_label;
    document.getElementById('openerText').textContent  = stage.opener_text;

    /* 更新進度與導航按鈕 */
    document.getElementById('progressText').textContent   = `${stageIndex + 1} / ${stages.length}`;
    document.getElementById('prevBtn').disabled           = stageIndex === 0;
    document.getElementById('nextBtn').disabled           = stageIndex === stages.length - 1;
    document.getElementById('nextBtn').textContent        = stageIndex === stages.length - 1 ? '已是最後階段' : '下一階段 →';

    /* 渲染異議按鈕 */
    renderObjections(stageId);

    /* 隱藏上一次展開的話術 */
    hideResponseArea();
}


/* ============================================================
   渲染客戶異議按鈕網格
   ============================================================ */
function renderObjections(stageId) {
    const grid = document.getElementById('objectionGrid');
    if (!grid) return;

    const dialogues = state.dialogues.filter(d =>
        d.industry_id === state.currentIndustryId &&
        d.stage_id    === stageId &&
        isActive(d.is_active)
    );

    if (dialogues.length === 0) {
        grid.innerHTML = '<div style="grid-column:1/-1;padding:20px;text-align:center;color:var(--text-memo);font-size:13px;">此階段尚無話術內容，請在 Google Sheets 的 dialogues Sheet 中新增。</div>';
        return;
    }

    grid.innerHTML = '';
    dialogues.forEach(d => {
        const btn = document.createElement('button');
        btn.className = 'objection-btn';
        btn.id        = `obj_${d.dialogue_id}`;
        btn.innerHTML = `
            <div class="objection-tag">${escHtml(d.objection_tag)}</div>
            <div class="objection-preview">${escHtml(d.client_says)}</div>
        `;
        btn.onclick = () => showDialogue(d.dialogue_id);
        grid.appendChild(btn);
    });
}


/* ============================================================
   點擊異議按鈕：展示話術
   ============================================================ */
function showDialogue(dialogueId) {
    const d = state.dialogues.find(x => x.dialogue_id === dialogueId);
    if (!d) return;

    /* 更新按鈕選中狀態 */
    document.querySelectorAll('.objection-btn').forEach(btn => {
        btn.className = btn.id === `obj_${dialogueId}` ? 'objection-btn selected' : 'objection-btn';
    });

    /* 填入話術內容 */
    document.getElementById('clientSaysText').textContent   = d.client_says;
    document.getElementById('salesResponseText').textContent = d.sales_response;
    document.getElementById('salesTipText').textContent     = d.sales_tip;

    /* 來源標籤 */
    const src = document.getElementById('sourceTag');
    if (d.source) {
        src.textContent = `來源：${d.source}${d.last_updated ? '　最後更新：' + d.last_updated : ''}`;
        src.style.display = 'block';
    } else {
        src.style.display = 'none';
    }

    /* 顯示話術區（帶 fadeIn 動畫）*/
    const area = document.getElementById('responseArea');
    area.className = 'response-area'; /* 先移掉 visible 觸發動畫 reset */
    void area.offsetWidth;            /* 強制 reflow */
    area.className = 'response-area visible';

    /* 平滑捲動到話術區 */
    area.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}


/* ============================================================
   前後階段導航（底部按鈕觸發）
   ============================================================ */
function goStage(delta) {
    const stages = getActiveStages(state.currentIndustryId);
    const idx    = stages.findIndex(s => s.stage_id === state.currentStageId);
    const next   = idx + delta;
    if (next >= 0 && next < stages.length) {
        selectStage(stages[next].stage_id);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
}


/* ============================================================
   工具函式
   ============================================================ */

/* 判斷 is_active 欄位（可能是字串 'TRUE' 或布林值 true） */
function isActive(val) {
    return val === 'TRUE' || val === true;
}

/* 取得指定產業的啟用階段（已排序） */
function getActiveStages(industryId) {
    return state.stages
        .filter(s => s.industry_id === industryId && isActive(s.is_active))
        .sort((a, b) => +a.sort_order - +b.sort_order);
}

/* 隱藏話術展示區 */
function hideResponseArea() {
    const area = document.getElementById('responseArea');
    if (area) area.className = 'response-area';
}

/* 防 XSS：對插入 HTML 的文字做 escape */
function escHtml(str) {
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}


/* ============================================================
   載入狀態 / 錯誤狀態 UI
   ============================================================ */
function showLoadingState() {
    document.getElementById('appContent').innerHTML = `
        <div class="loading-overlay">
            <div class="spinner"></div>
            <div class="loading-text">正在載入話術內容...</div>
        </div>`;
}

function showErrorState(message) {
    document.getElementById('appContent').innerHTML = `
        <div class="error-box">
            <h3>&#x26A0; 內容載入失敗</h3>
            <p>${escHtml(message).replace(/\n/g, '<br>')}</p>
            <button onclick="boot()">重新載入</button>
        </div>`;
}


/* ============================================================
   啟動！
   ============================================================ */
boot();
</script>
